<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gapless Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #14171F; }
  * { box-sizing: border-box; }
  #boot-status { color: #8A8FA3; font-family: system-ui, sans-serif; padding: 24px; font-size: 14px; }
</style>
</head>
<body>
<div id="boot-status">Loading…</div>
<div id="root"></div>

<script>
  window.onerror = function (msg, url, line, col, error) {
    var el = document.getElementById("boot-status");
    if (!el) return false;
    el.style.color = "#E88C6E";
    el.style.whiteSpace = "pre-wrap";
    el.textContent = "Failed to load: " + msg + "\n(line " + line + ")\n\nScreenshot this and send it back.";
    return false;
  };
</script>

<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" onerror="document.getElementById('boot-status').textContent='React failed to load from CDN — check your connection or try again.'"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" onerror="document.getElementById('boot-status').textContent='ReactDOM failed to load from CDN — check your connection or try again.'"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.3/babel.min.js" onerror="document.getElementById('boot-status').textContent='Babel failed to load from CDN — check your connection or try again.'"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

const SAMPLE_TEXT = `The lighthouse keeper had not spoken to another soul in eleven days. It was not loneliness that troubled him, exactly, but a kind of static that built up behind his ribs when there was no one to spend his words on.

He wrote them instead, in a ledger meant for weather. Fog, he wrote. Fog like a held breath. The gulls know something I don't.

On the twelfth day, a boat appeared on the horizon, small and stubborn against the gray. He watched it for an hour before he let himself believe it was real, and then he began, quietly, to practice the sound of his own voice. Dr. Alden used to say that Mr. Byrne's charts were wrong, but Ji-woo never trusted the old maps either.`;

const KOKORO_MODEL_ID = "onnx-community/Kokoro-82M-v1.0-ONNX";
const KOKORO_VOICES = [
  { id: "af_heart", label: "Heart (US female)" },
  { id: "af_sky", label: "Sky (US female)" },
  { id: "am_adam", label: "Adam (US male)" },
  { id: "bf_emma", label: "Emma (UK female)" },
];

const LOOKAHEAD = 3;
const ABBR = new Set(["mr","mrs","ms","dr","st","jr","sr","vs","etc","e.g","i.e","prof","rev","gen","col","sgt","capt","lt","mt","ave","no","inc","ltd","co"]);

function splitSentencesSmart(para) {
  const raw = para.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [para];
  const merged = [];
  raw.forEach((s) => {
    const trimmed = s.trim();
    if (!trimmed) return;
    const prev = merged[merged.length - 1];
    const abbrMatch = prev && prev.match(/(\w+)\.\s*$/);
    if (prev && abbrMatch && ABBR.has(abbrMatch[1].toLowerCase())) {
      merged[merged.length - 1] = prev + " " + trimmed;
    } else {
      merged.push(trimmed);
    }
  });
  return merged;
}

function splitIntoChunks(text) {
  const paragraphs = text.split(/\n\s*\n/).filter((p) => p.trim());
  const chunks = [];
  paragraphs.forEach((para, pi) => {
    const sentences = splitSentencesSmart(para);
    sentences.forEach((s, si) => {
      chunks.push({ text: s, paraIndex: pi, isParaEnd: si === sentences.length - 1 });
    });
  });
  return chunks;
}

function detectScript(ch) {
  const code = ch.codePointAt(0);
  if (code >= 0x3040 && code <= 0x30ff) return "ja";
  if (code >= 0xac00 && code <= 0xd7a3) return "ko";
  if (code >= 0x4e00 && code <= 0x9fff) return "zh";
  return null;
}
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// Kokoro is English-only, so any sentence containing native CJK script or a
// dictionary-flagged romanized name gets read by the browser's voice instead.
function needsNativeVoice(text, dict) {
  for (const ch of text) if (detectScript(ch)) return true;
  return dict.some((entry) => new RegExp(`(?<![A-Za-z])${escapeRe(entry.name)}(?![A-Za-z])`, "i").test(text));
}

function hashText(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

const hasBrowserTTS = typeof window !== "undefined" && !!window.speechSynthesis;
const LANG_LABEL = { ko: "Korean", zh: "Chinese", ja: "Japanese" };

function NovelReader() {
  const [rawText, setRawText] = useState(SAMPLE_TEXT);
  const [chunks, setChunks] = useState(() => splitIntoChunks(SAMPLE_TEXT));
  const [stage, setStage] = useState("edit");
  const [playing, setPlaying] = useState(false);
  const [activeIndex, setActiveIndex] = useState(-1);
  const [queuedUpTo, setQueuedUpTo] = useState(-1);
  const [showSettings, setShowSettings] = useState(false);

  const [engine, setEngine] = useState(hasBrowserTTS ? "browser" : "kokoro");
  const [kokoroStatus, setKokoroStatus] = useState("idle"); // idle | loading | ready | error
  const [kokoroProgress, setKokoroProgress] = useState("");
  const [kokoroVoiceId, setKokoroVoiceId] = useState(KOKORO_VOICES[0].id);
  const [customVoiceId, setCustomVoiceId] = useState("");
  const [aiStatus, setAiStatus] = useState("");
  const [downloadStatus, setDownloadStatus] = useState("");

  const [pronunciationDict, setPronunciationDict] = useState([]);
  const [dictLoaded, setDictLoaded] = useState(false);
  const [newName, setNewName] = useState("");
  const [newLang, setNewLang] = useState("ko");

  const [voices, setVoices] = useState([]);
  const [voiceURI, setVoiceURI] = useState("");
  const [rate, setRate] = useState(1);

  const chunkRef = useRef(chunks);
  const stoppedRef = useRef(true);
  const audioElRef = useRef(null);
  const audioCacheRef = useRef({});
  const playIndexRef = useRef(-1);
  const bookIdRef = useRef(hashText(rawText));
  const kokoroRef = useRef(null);

  useEffect(() => { chunkRef.current = chunks; }, [chunks]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("pronunciation-dict");
      if (raw) setPronunciationDict(JSON.parse(raw));
    } catch (e) {}
    setDictLoaded(true);
  }, []);
  useEffect(() => {
    if (!dictLoaded) return;
    try { localStorage.setItem("pronunciation-dict", JSON.stringify(pronunciationDict)); } catch (e) {}
  }, [pronunciationDict, dictLoaded]);

  useEffect(() => {
    if (stage !== "reading") return;
    try {
      const raw = localStorage.getItem("book-pos:" + bookIdRef.current);
      if (raw) {
        const saved = JSON.parse(raw);
        if (typeof saved.index === "number" && saved.index < chunkRef.current.length && saved.index > 0) {
          setActiveIndex(saved.index);
          playIndexRef.current = saved.index;
        }
      }
    } catch (e) {}
  }, [stage]);
  useEffect(() => {
    if (stage !== "reading" || activeIndex < 0) return;
    try { localStorage.setItem("book-pos:" + bookIdRef.current, JSON.stringify({ index: activeIndex })); } catch (e) {}
  }, [activeIndex, stage]);

  useEffect(() => {
    if (!hasBrowserTTS) return;
    function loadVoices() {
      const v = window.speechSynthesis.getVoices();
      if (v.length) {
        setVoices(v);
        setVoiceURI((prev) => prev || (v.find((x) => /en/i.test(x.lang)) || v[0]).voiceURI);
      }
    }
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => { window.speechSynthesis.cancel(); };
  }, []);

  // ---------- Kokoro engine (runs entirely in-browser, no server) ----------
  const ensureKokoro = useCallback(async () => {
    if (kokoroRef.current) return kokoroRef.current;
    setKokoroStatus("loading");
    setKokoroProgress("Downloading voice model (~160MB, one-time — then it's cached for offline use)…");
    try {
      const mod = await import("https://esm.sh/kokoro-js@1.2.1");
      const tts = await mod.KokoroTTS.from_pretrained(KOKORO_MODEL_ID, { dtype: "q8", device: "wasm" });
      kokoroRef.current = tts;
      setKokoroStatus("ready");
      setKokoroProgress("");
      return tts;
    } catch (e) {
      setKokoroStatus("error");
      setKokoroProgress("Failed to load voice model: " + String((e && e.message) || e).slice(0, 150));
      throw e;
    }
  }, []);

  const activeVoiceId = customVoiceId.trim() || kokoroVoiceId;

  const fetchChunkAudio = useCallback(async (idx) => {
    const cache = audioCacheRef.current;
    if (cache[idx] === "loading" || (cache[idx] && cache[idx] !== "error")) return;
    const chunk = chunkRef.current[idx];
    if (!chunk) return;

    if (needsNativeVoice(chunk.text, pronunciationDict)) {
      cache[idx] = "native";
      setQueuedUpTo((q) => Math.max(q, idx));
      return;
    }

    cache[idx] = "loading";
    try {
      const tts = await ensureKokoro();
      const audio = await tts.generate(chunk.text, { voice: activeVoiceId, speed: rate });
      const blob = audio.toBlob();
      cache[idx] = URL.createObjectURL(blob);
      setQueuedUpTo((q) => Math.max(q, idx));
      setAiStatus("");
    } catch (e) {
      cache[idx] = "error";
      setAiStatus("Voice generation error: " + String((e && e.message) || e).slice(0, 100));
    }
  }, [pronunciationDict, ensureKokoro, activeVoiceId, rate]);

  const prefetchAhead = useCallback((fromIdx) => {
    for (let i = fromIdx; i < Math.min(fromIdx + LOOKAHEAD, chunkRef.current.length); i++) fetchChunkAudio(i);
  }, [fetchChunkAudio]);

  const playKokoroFrom = useCallback(async (idx) => {
    playIndexRef.current = idx;
    stoppedRef.current = false;
    setActiveIndex(idx);
    const chunk = chunkRef.current[idx];
    if (!chunk) return;
    prefetchAhead(idx);

    if (needsNativeVoice(chunk.text, pronunciationDict) && hasBrowserTTS) {
      const u = new SpeechSynthesisUtterance(chunk.text);
      const v = voices.find((x) => x.voiceURI === voiceURI);
      if (v) u.voice = v;
      u.rate = rate;
      u.onend = () => {
        if (stoppedRef.current) return;
        const next = idx + 1;
        if (next < chunkRef.current.length) playKokoroFrom(next);
        else { setPlaying(false); setActiveIndex(-1); }
      };
      window.speechSynthesis.speak(u);
      setPlaying(true);
      return;
    }

    let waited = 0;
    while (audioCacheRef.current[idx] === "loading" && waited < 60000) {
      await new Promise((r) => setTimeout(r, 200));
      waited += 200;
    }
    const src = audioCacheRef.current[idx];
    if (!src || src === "error" || src === "native" || stoppedRef.current || playIndexRef.current !== idx) return;
    const el = audioElRef.current;
    el.src = src;
    try { await el.play(); setPlaying(true); }
    catch (e) { setAiStatus("playback blocked — tap play again"); }
  }, [prefetchAhead, pronunciationDict, voices, voiceURI, rate]);

  useEffect(() => {
    const el = audioElRef.current;
    if (!el) return;
    const onEnded = () => {
      if (stoppedRef.current) return;
      const next = playIndexRef.current + 1;
      if (next < chunkRef.current.length) playKokoroFrom(next);
      else { setPlaying(false); setActiveIndex(-1); }
    };
    el.addEventListener("ended", onEnded);
    return () => el.removeEventListener("ended", onEnded);
  }, [playKokoroFrom]);

  // ---------- Browser engine (Web Speech API) ----------
  const makeUtterance = useCallback((chunk, idx) => {
    const u = new SpeechSynthesisUtterance(chunk.text);
    const v = voices.find((x) => x.voiceURI === voiceURI);
    if (v) u.voice = v;
    u.rate = rate;
    u.onstart = () => {
      setActiveIndex(idx);
      setQueuedUpTo((q) => Math.max(q, Math.min(idx + LOOKAHEAD, chunkRef.current.length - 1)));
    };
    u.onend = () => {
      if (idx === chunkRef.current.length - 1 && !stoppedRef.current) {
        setPlaying(false); setActiveIndex(-1); stoppedRef.current = true;
      }
    };
    return u;
  }, [voices, voiceURI, rate]);

  const startBrowserReading = useCallback((fromIndex) => {
    if (!hasBrowserTTS) return;
    window.speechSynthesis.cancel();
    stoppedRef.current = false;
    chunkRef.current.slice(fromIndex).map((c, i) => makeUtterance(c, fromIndex + i)).forEach((u) => window.speechSynthesis.speak(u));
    setPlaying(true);
  }, [makeUtterance]);

  // ---------- Shared controls ----------
  const handlePlayPause = useCallback(() => {
    if (engine === "kokoro") {
      if (kokoroStatus !== "ready") {
        setShowSettings(true);
        if (kokoroStatus === "idle") ensureKokoro().then(() => playKokoroFrom(activeIndex >= 0 ? activeIndex : 0)).catch(() => {});
        return;
      }
      const el = audioElRef.current;
      if (playing) {
        if (window.speechSynthesis && window.speechSynthesis.speaking) window.speechSynthesis.pause();
        el.pause();
        setPlaying(false);
      } else if (el.src && playIndexRef.current === activeIndex) {
        el.play(); setPlaying(true);
      } else {
        playKokoroFrom(activeIndex >= 0 ? activeIndex : 0);
      }
      return;
    }
    if (!hasBrowserTTS) return;
    if (playing) { window.speechSynthesis.pause(); setPlaying(false); }
    else if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); setPlaying(true); }
    else { startBrowserReading(activeIndex >= 0 ? activeIndex : 0); }
  }, [engine, kokoroStatus, playing, activeIndex, playKokoroFrom, startBrowserReading, ensureKokoro]);

  const handleStop = useCallback(() => {
    stoppedRef.current = true;
    if (hasBrowserTTS) window.speechSynthesis.cancel();
    if (audioElRef.current) { audioElRef.current.pause(); audioElRef.current.removeAttribute("src"); }
    playIndexRef.current = -1;
    setPlaying(false); setActiveIndex(-1); setQueuedUpTo(-1);
  }, []);

  const handleChunkClick = useCallback((idx) => {
    stoppedRef.current = true;
    if (hasBrowserTTS) window.speechSynthesis.cancel();
    if (engine === "kokoro") { if (kokoroStatus === "ready") playKokoroFrom(idx); else setShowSettings(true); }
    else startBrowserReading(idx);
  }, [engine, kokoroStatus, playKokoroFrom, startBrowserReading]);

  // ---------- Media Session (lock screen / car controls) ----------
  useEffect(() => {
    if (!("mediaSession" in navigator) || typeof window.MediaMetadata === "undefined") return;
    const currentText = chunks[activeIndex] && chunks[activeIndex].text;
    navigator.mediaSession.metadata = new window.MediaMetadata({
      title: currentText ? currentText.slice(0, 60) : "Reading",
      artist: "Gapless Reader",
    });
    navigator.mediaSession.playbackState = playing ? "playing" : "paused";
    navigator.mediaSession.setActionHandler("play", handlePlayPause);
    navigator.mediaSession.setActionHandler("pause", handlePlayPause);
    navigator.mediaSession.setActionHandler("previoustrack", () => handleChunkClick(Math.max(0, activeIndex - 1)));
    navigator.mediaSession.setActionHandler("nexttrack", () => handleChunkClick(Math.min(chunks.length - 1, activeIndex + 1)));
  }, [playing, activeIndex, chunks, handlePlayPause, handleChunkClick]);

  const goToReading = () => {
    audioCacheRef.current = {};
    bookIdRef.current = hashText(rawText);
    setChunks(splitIntoChunks(rawText));
    setActiveIndex(-1);
    setStage("reading");
  };

  const addDictEntry = () => {
    const name = newName.trim();
    if (!name) return;
    setPronunciationDict((d) => [...d, { name, lang: newLang }]);
    setNewName("");
  };
  const removeDictEntry = (i) => setPronunciationDict((d) => d.filter((_, idx) => idx !== i));

  const downloadChapter = async () => {
    if (kokoroStatus !== "ready") { setDownloadStatus("Load the voice model first"); return; }
    const list = chunkRef.current;
    const blobs = [];
    for (let i = 0; i < list.length; i++) {
      if (needsNativeVoice(list[i].text, pronunciationDict)) {
        setDownloadStatus(`Skipping ${i + 1}/${list.length} (foreign-name fallback isn't downloadable)…`);
        continue;
      }
      setDownloadStatus(`Generating ${i + 1}/${list.length}…`);
      await fetchChunkAudio(i);
      if (audioCacheRef.current[i] === "error") { setDownloadStatus(`Failed on sentence ${i + 1}`); return; }
      const r = await fetch(audioCacheRef.current[i]);
      blobs.push(await r.blob());
    }
    setDownloadStatus("Merging…");
    const finalBlob = new Blob(blobs, { type: "audio/wav" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(finalBlob);
    a.download = "chapter.wav";
    a.click();
    setDownloadStatus("Downloaded.");
  };

  const bufferDots = Array.from({ length: LOOKAHEAD }, (_, i) => {
    const idx = activeIndex + i;
    if (idx < 0 || idx >= chunks.length) return false;
    if (engine === "kokoro") {
      const v = audioCacheRef.current[idx];
      return v && v !== "loading" && v !== "error";
    }
    return idx <= queuedUpTo;
  });

  if (stage === "edit") {
    return (
      <div style={styles.page}>
        <div style={styles.editWrap}>
          <div style={styles.brand}><span style={styles.brandIcon}>📖</span><span style={styles.brandText}>Gapless</span></div>
          <h1 style={styles.editTitle}>Paste your text</h1>
          <p style={styles.editSub}>Full EPUB/PDF import comes next — for now, drop in a passage to hear the buffering engine at work.</p>
          <textarea style={styles.textarea} value={rawText} onChange={(e) => setRawText(e.target.value)} spellCheck={false} />
          <button style={styles.primaryBtn} onClick={goToReading}>Start reading</button>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <audio ref={audioElRef} playsInline style={{ display: "none" }} />
      <div style={styles.topBar}>
        <button style={styles.iconBtn} onClick={() => { handleStop(); setStage("edit"); }}>📖</button>
        <div style={styles.bufferRow}>
          {bufferDots.map((filled, i) => <span key={i} style={{ ...styles.bufferDot, background: filled ? "#E8A33D" : "#2A2F42" }} />)}
        </div>
        <button style={styles.iconBtn} onClick={() => setShowSettings((s) => !s)}>⚙️</button>
      </div>

      {showSettings && (
        <div style={styles.settingsPanel}>
          <div style={styles.engineToggle}>
            <button
              style={{ ...styles.engineBtn, ...(engine === "browser" ? styles.engineBtnActive : {}), ...(hasBrowserTTS ? {} : { opacity: 0.4 }) }}
              onClick={() => { if (hasBrowserTTS) { handleStop(); setEngine("browser"); } }}
            >
              Browser voice{hasBrowserTTS ? "" : " (unsupported here)"}
            </button>
            <button style={{ ...styles.engineBtn, ...(engine === "kokoro" ? styles.engineBtnActive : {}) }} onClick={() => { handleStop(); setEngine("kokoro"); }}>
              ✨ AI voice (offline, free)
            </button>
          </div>

          {engine === "browser" ? (
            <>
              <label style={styles.settingLabel}>Voice</label>
              <select style={styles.select} value={voiceURI} onChange={(e) => setVoiceURI(e.target.value)}>
                {voices.map((v) => <option key={v.voiceURI} value={v.voiceURI}>{v.name} ({v.lang})</option>)}
              </select>
              <p style={styles.settingNote}>Browser voices may pause when your screen locks — use AI voice for reliable background/car playback.</p>
            </>
          ) : (
            <>
              {kokoroStatus !== "ready" && (
                <button style={styles.primaryBtnSmall} onClick={() => ensureKokoro().catch(() => {})} disabled={kokoroStatus === "loading"}>
                  {kokoroStatus === "loading" ? "Loading…" : kokoroStatus === "error" ? "Retry loading voice model" : "Load voice model"}
                </button>
              )}
              {kokoroProgress && <p style={styles.settingNote}>{kokoroProgress}</p>}
              {kokoroStatus === "ready" && <p style={styles.settingNote}>Voice model loaded and cached — works offline from now on.</p>}

              <label style={styles.settingLabel}>Voice</label>
              <select style={styles.select} value={kokoroVoiceId} onChange={(e) => setKokoroVoiceId(e.target.value)}>
                {KOKORO_VOICES.map((v) => <option key={v.id} value={v.id}>{v.label}</option>)}
              </select>
              <input style={styles.select} placeholder="or type a custom voice ID" value={customVoiceId} onChange={(e) => setCustomVoiceId(e.target.value)} />
              {aiStatus && <p style={styles.errorNote}>{aiStatus}</p>}

              <label style={styles.settingLabel}>Name pronunciation (Korean / Chinese / Japanese)</label>
              {pronunciationDict.map((entry, i) => (
                <div key={i} style={styles.dictRow}>
                  <span style={styles.dictName}>{entry.name}</span>
                  <span style={styles.dictLang}>{LANG_LABEL[entry.lang]}</span>
                  <button style={styles.dictRemove} onClick={() => removeDictEntry(i)}>✕</button>
                </div>
              ))}
              <div style={styles.dictAddRow}>
                <input style={{ ...styles.select, flex: 1 }} placeholder="e.g. Ji-woo" value={newName} onChange={(e) => setNewName(e.target.value)} />
                <select style={styles.select} value={newLang} onChange={(e) => setNewLang(e.target.value)}>
                  <option value="ko">Korean</option>
                  <option value="zh">Chinese</option>
                  <option value="ja">Japanese</option>
                </select>
                <button style={styles.dictAddBtn} onClick={addDictEntry}>+</button>
              </div>
              <p style={styles.settingNote}>Kokoro (the AI voice) is English-only, so native CJK script and any name listed here are read by your browser's built-in voice instead — that's the trade-off for having a fully offline, no-server AI voice.</p>

              <button style={styles.downloadBtn} onClick={downloadChapter}>⬇ Download this chapter as WAV</button>
              {downloadStatus && <p style={styles.settingNote}>{downloadStatus}</p>}
            </>
          )}

          <label style={styles.settingLabel}>Speed: {rate.toFixed(2)}x</label>
          <input type="range" min="0.6" max="1.8" step="0.05" value={rate} onChange={(e) => setRate(parseFloat(e.target.value))} style={styles.slider} />
        </div>
      )}

      <div style={styles.readingPane}>
        {chunks.map((c, idx) => (
          <span key={idx} onClick={() => handleChunkClick(idx)} style={{ ...styles.sentence, ...(idx === activeIndex ? styles.sentenceActive : {}) }}>
            {c.text}{c.isParaEnd ? "\n\n" : " "}
          </span>
        ))}
      </div>

      <div style={styles.controlBar}>
        <button style={styles.controlBtn} onClick={handleStop}>⏹</button>
        <button style={styles.playBtn} onClick={handlePlayPause}>{playing ? "⏸" : "▶"}</button>
        <div style={styles.rateChip}>{engine === "kokoro" ? "AI" : "Browser"}</div>
      </div>
    </div>
  );
}

const styles = {
  page: { minHeight: "100vh", background: "#14171F", fontFamily: "'Source Sans Pro', system-ui, sans-serif", color: "#E8E3D3", display: "flex", flexDirection: "column" },
  editWrap: { maxWidth: 640, margin: "0 auto", padding: "48px 24px", display: "flex", flexDirection: "column", gap: 14, width: "100%" },
  brand: { display: "flex", alignItems: "center", gap: 8, marginBottom: 8 },
  brandIcon: { fontSize: 18 },
  brandText: { fontFamily: "'Lora', Georgia, serif", fontSize: 15, letterSpacing: "0.06em", textTransform: "uppercase", color: "#8A8FA3" },
